<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายชื่อผู้สูงอายุ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px 8px;
            border-bottom: 1px solid #ddd;
            text-align: center;
            font-size: 15px;
        }

        th {
            background: #2B8FED;
            color: white;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #2B8FED;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #1675cc;
        }

        .btn-back {
            background: #6c757d;
        }

        .btn-back:hover {
            background: #5a6268;
        }

        .delete {
            background: #e74c3c;
            margin: 0;
            padding: 6px 12px;
            font-size: 14px;
        }

        .delete:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>รายชื่อผู้สูงอายุ</h1>

    <table>
        <thead>
            <tr>
                <th>ลำดับ</th>
                <th>ชื่อ</th>
                <th>อายุ</th>
                <th>คะแนนที่คาดว่าจะทำได้</th>
                <th>คะแนนที่ทำได้เมื่อไม่จับเวลา</th>
                <th>คะแนนที่ทำได้เมื่อจับเวลาข้อละ 5 วินาที</th>
                <th>เวลาที่ลงทะเบียน</th>
                <th>จัดการ</th>
            </tr>
        </thead>

        <tbody id="nameList"></tbody>
    </table>

    <div class="btn-group">
        <button class="btn-back" onclick="location.href='index.html'">
            ← กลับหน้าลงทะเบียน
        </button>
        <button onclick="location.href='index.html'">
            + ลงทะเบียนเพิ่ม
        </button>
    </div>

</div>

<script>

function showList() {

    const list = JSON.parse(localStorage.getItem("elderlyList")) || [];

    const table = document.getElementById("nameList");

    table.innerHTML = "";

    list.forEach((person, index) => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${person.name}</td>
            <td>${person.age} ปี</td>
            <td>${person.score !== undefined && person.score !== null ? person.score : '-'} / 5</td>
            <td>${person.untimedScore !== undefined && person.untimedScore !== null ? person.untimedScore : '-'} / 5</td>
            <td>${person.timedScore !== undefined && person.timedScore !== null ? person.timedScore : '-'} / 5</td>
            <td>${person.time}</td>
            <td>
                <button class="delete" onclick="deletePerson(${index})">
                    ลบ
                </button>
            </td>
        `;

        table.appendChild(row);
    });
}

function deletePerson(index) {

    if (!confirm("ต้องการลบรายชื่อนี้หรือไม่?")) {
        return;
    }

    let list = JSON.parse(localStorage.getItem("elderlyList")) || [];

    list.splice(index, 1);

    localStorage.setItem("elderlyList", JSON.stringify(list));

    showList();
}

showList();

</script>

</body>
</html>
